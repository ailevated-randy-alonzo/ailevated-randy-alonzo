<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="355" viewBox="0 0 1160 355" role="img" aria-label="Engineering proof beyond a list of technologies"><title>Engineering proof beyond a list of technologies</title><desc>Evidence-based checkpoints for verifying architecture, security, failure handling and tests.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A182A"/><stop offset="1" stop-color="#112A43"/></linearGradient><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#D4F0FA" stroke-opacity=".045"/></pattern></defs><rect width="1160" height="355" rx="18" fill="url(#bg)"/><rect width="1160" height="355" rx="18" fill="url(#grid)"/><rect y="0" width="1160" height="5" fill="#51D6CD"/><text x="48" y="62" font-family="Arial,Helvetica,sans-serif" font-size="24" letter-spacing="3" font-weight="700" fill="#76DBCF">READ THE CODE</text><text x="48" y="123" font-family="Arial,Helvetica,sans-serif" font-size="49" letter-spacing="-1" font-weight="800" fill="#F5FBFF">Engineering evidence, not slogans.</text><g transform="translate(47,181)"><rect width="258" height="136" rx="13" fill="#132E47" stroke="#3E657C" stroke-width="2"/><path d="M0 0H258" stroke="#6FD7F0" stroke-width="5"/><circle cx="29" cy="34" r="7" fill="#6FD7F0"/><text x="49" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.5" fill="#6FD7F0" font-weight="700">SECURITY</text><text x="18" y="87" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700">Who owns this data?</text><text x="18" y="115" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9CBCD0">Auth + ownership</text></g><g transform="translate(332,181)"><rect width="258" height="136" rx="13" fill="#132E47" stroke="#3E657C" stroke-width="2"/><path d="M0 0H258" stroke="#81E6CE" stroke-width="5"/><circle cx="29" cy="34" r="7" fill="#81E6CE"/><text x="49" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.5" fill="#81E6CE" font-weight="700">RELIABILITY</text><text x="18" y="87" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700">What if it fails?</text><text x="18" y="115" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9CBCD0">Timeouts + fallback</text></g><g transform="translate(617,181)"><rect width="258" height="136" rx="13" fill="#132E47" stroke="#3E657C" stroke-width="2"/><path d="M0 0H258" stroke="#F1BD7D" stroke-width="5"/><circle cx="29" cy="34" r="7" fill="#F1BD7D"/><text x="49" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.5" fill="#F1BD7D" font-weight="700">QUALITY</text><text x="18" y="87" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700">How is it tested?</text><text x="18" y="115" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9CBCD0">Tests + build checks</text></g><g transform="translate(902,181)"><rect width="258" height="136" rx="13" fill="#132E47" stroke="#3E657C" stroke-width="2"/><path d="M0 0H258" stroke="#BCA9F7" stroke-width="5"/><circle cx="29" cy="34" r="7" fill="#BCA9F7"/><text x="49" y="43" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="1.5" fill="#BCA9F7" font-weight="700">BACKEND</text><text x="18" y="87" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#F7FBFF" font-weight="700">What's the contract?</text><text x="18" y="115" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#9CBCD0">Routes + validation</text></g></svg>