<title id="title">Hyrvanta verified implementation boundaries</title><desc id="desc">A React frontend calls authenticated Cloudflare Worker API routes. The server checks resource ownership and accesses Cloudflare D1 metadata and private R2 résumé objects. A separate Greenhouse and Lever synchronization process normalizes external job records into D1.</desc>
