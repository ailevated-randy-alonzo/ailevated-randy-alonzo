<title id="at">Hyrvanta application architecture</title>
<desc id="ad">Browser-based React frontend calls authenticated Worker API routes. Server checks ownership then connects to Cloudflare D1 metadata and private R2 resumes. Employer feeds pass through a separate protected server-side normalization workflow to D1.</desc>
