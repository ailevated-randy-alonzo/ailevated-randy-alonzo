<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="482" viewBox="0 0 1320 482" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Hyrvanta architecture overview</title>
<desc id="arch-desc">Authenticated user requests flow from React to the Worker API, which reads and writes D1 records and private R2 résumé objects. External Greenhouse and Lever employer feeds enter through server-side synchronization, verification, and normalization into D1.</desc>
