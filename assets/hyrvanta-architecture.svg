<title id="t">Hyrvanta system architecture</title><desc id="d">React browser client talks to an authenticated Cloudflare Worker API. Worker accesses Cloudflare D1 for structured records and private R2 for résumé files. Employer sources are synchronized through separate server-side adapters into D1.</desc>
